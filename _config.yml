# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Language
lang: en

# Timezone
timezone: UTC

# SEO & Meta
title: "iam_RG@root:~#"
tagline: "Offensive Security | Red Teaming | CTF Writeups"
description: >-
  Offensive security research, penetration testing methodologies, and CTF writeups across TryHackMe, HackTheBox, and PwnTillDawn by iam_RG. Break, Learn, Secure.

url: "https://cy3erdr4g0n.github.io"

github:
  username: cy3erdr4g0n

twitter:
  username: respectgraceman

social:
  name: "iam_RG"
  email: eqr2s90qm@mozmail.com
  links:
    - https://github.com/cy3erdr4g0n
    - https://twitter.com/respectgraceman
    - https://www.linkedin.com/in/akintola-john-1801a0238

# Prefer color scheme setting (dark mode default for security/hacker vibe)
theme_mode: dark

# Avatar on sidebar (uses your GitHub profile picture)
avatar: "https://github.com/cy3erdr4g0n.png"

# Table of Contents
toc: true

# PWA settings
pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10
baseurl: ""

# Markdown & Syntax Highlighting
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - "Post"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
